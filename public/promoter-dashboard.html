<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>크리에이터 대시보드 — Linko</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="logo"><span class="mark">L</span> Linko</div>
    <nav class="nav-links">
      <a href="/index.html">캠페인 둘러보기</a>
    </nav>
    <nav class="nav-links role-links">
      <a href="/advertiser-dashboard.html">광고주</a>
      <a href="/promoter-dashboard.html" class="active">크리에이터</a>
    </nav>
    <span id="linkoRoleWalletBadge" style="font-size:12px; margin-left:10px; white-space:nowrap;"></span>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <h1 id="pageTitle">크리에이터 대시보드</h1>
      <p>내가 참여한 캠페인의 누적 판매 건수, 현재 비율, 정산 내역을 확인하세요.</p>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="panel">
      <h2>참여 중인 캠페인</h2>
      <table id="participationTable">
        <thead><tr><th>캠페인</th><th>추천 링크</th><th>누적 확정건수</th><th>현재 비율</th><th>다음 구간까지</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>판매 성과</h2>
      <p style="color:var(--muted); font-size:13px; margin-top:-8px;">구매 확정 후 즉시 정산됩니다. (실제 결제는 USDC로 온체인 지급돼요)</p>
      <table id="orderTable">
        <thead><tr><th>캠페인</th><th>금액</th><th>상태</th><th>적용비율</th><th>리워드</th><th>정산 tx</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="orderEmpty" class="empty-state" style="display:none;">아직 주문이 없어요.</div>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/wallet-widget.js"></script>
<script src="/js/wallet-session.js"></script>
<script src="/js/promoter-dashboard.js"></script>
<script src="/js/agent-chat.js"></script>
</body>
</html>
